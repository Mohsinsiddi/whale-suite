[package]
name = "confidential-whale-badge"
version = "0.1.0"
description = "Confidential Whale Badge using Inco Lightning for encrypted tier verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_whale_badge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
inco-lightning = { version = "0.1.4", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
