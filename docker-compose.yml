services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: whale-suite-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=whale-suite
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/whale-suite --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express - Admin UI (optional, for development)
  mongo-express:
    image: mongo-express:latest
    container_name: whale-suite-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=whale123
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
    name: whale-suite-mongo-data
