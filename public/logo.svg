<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Water spout -->
  <g opacity="0.8">
    <path d="M44 8c0-2 1-5 2-5s2 3 2 5c0 1.5-0.5 2.5-2 2.5S44 9.5 44 8z" fill="url(#spoutGradient)"/>
    <path d="M41 6c0-1.5 0.5-3 1.5-3s1.5 1.5 1.5 3c0 1-0.5 1.5-1.5 1.5S41 7 41 6z" fill="url(#spoutGradient)" opacity="0.6"/>
    <path d="M49 7c0-1.5 0.5-3.5 1.5-3.5s1.5 2 1.5 3.5c0 1-0.5 1.5-1.5 1.5S49 8 49 7z" fill="url(#spoutGradient)" opacity="0.6"/>
  </g>

  <!-- Main whale body -->
  <path d="M8 32 C8 24 14 16 28 14 C36 13 44 14 50 18 C54 20 56 24 56 30 C56 36 54 42 48 46 C42 50 32 52 24 50 C16 48 10 44 8 38 C7 36 8 34 8 32Z" fill="url(#whaleBodyGradient)"/>

  <!-- Whale belly -->
  <path d="M12 36 C14 42 20 46 28 47 C36 48 42 46 46 43 C44 46 36 49 26 48 C18 47 12 42 12 36Z" fill="url(#whaleBellyGradient)" opacity="0.5"/>

  <!-- Dorsal fin -->
  <path d="M32 14 C34 14 38 10 40 8 C40 10 38 14 36 16 C34 18 32 18 32 16 L32 14Z" fill="url(#finGradient)"/>

  <!-- Tail fluke -->
  <path d="M8 32 C4 28 2 24 2 22 C4 24 6 26 8 28 L8 32Z M8 32 C4 36 2 40 2 42 C4 40 6 38 8 36 L8 32Z" fill="url(#tailGradient)"/>

  <!-- Pectoral fin -->
  <path d="M28 38 C30 40 34 44 36 46 C34 46 30 44 28 42 C26 40 26 38 28 38Z" fill="url(#finGradient)" opacity="0.8"/>

  <!-- Eye -->
  <circle cx="46" cy="28" r="3" fill="#0a0e14"/>
  <circle cx="47" cy="27" r="1" fill="rgba(255,255,255,0.6)"/>

  <!-- Smile -->
  <path d="M50 34 C52 36 52 38 50 38" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <defs>
    <linearGradient id="whaleBodyGradient" x1="8" y1="14" x2="56" y2="52">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="whaleBellyGradient" x1="12" y1="36" x2="46" y2="48">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="finGradient" x1="32" y1="8" x2="40" y2="18">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="tailGradient" x1="2" y1="22" x2="8" y2="42">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="spoutGradient" x1="44" y1="3" x2="48" y2="10">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>
